plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.example.mutantvillager'
version = '1.20.1-1.0.0'

base { archivesName = 'mutantvillager-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { mutantvillager { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'mutantvillager' }
        server { property 'forge.enabledGameTestNamespaces', 'mutantvillager' }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.26'
}

jar { finalizedBy 'reobfJar' }

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
    repositories { maven { url = layout.buildDirectory.dir('repo') } }
}
